name: Deploy FAMI landing — 5 août 2026

on:
  # 12h00 Paris (UTC+2 en été) = 10h00 UTC
  schedule:
    - cron: "0 10 5 8 *"

  # Déclenchement manuel depuis GitHub Actions si besoin
  workflow_dispatch:

jobs:
  merge-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Fetch fami-pricing-test
        run: git fetch origin fami-pricing-test

      - name: Merge fami-pricing-test into main
        run: |
          git merge origin/fami-pricing-test \
            --no-ff \
            -m "feat: mise en ligne landing FAMI — 5 août 2026 [scheduled deploy]"

      - name: Push to main
        run: git push origin main
